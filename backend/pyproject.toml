[project]
name = "geoguessr-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
